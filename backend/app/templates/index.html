<!-- backend/app/templates/index.html — PART 1 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZIZI Local Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #121212; color: #e0e0e0; }
        .creator-panel { max-width: 600px; margin: 0 auto 40px auto; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; }
        input, select { background: #222; color: #fff; }
        button { background: #0070f3; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0051a8; }
        
        .engine-selector { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #2d2d2d; }
        .engine-selector select { width: auto; margin: 0; padding: 6px 12px; }

        .settings-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .settings-matrix label { font-size: 0.8rem; color: #aaa; display: block; margin-top: 5px; }

        .job-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #555; }
        .status-QUEUED { border-left-color: #0070f3; }
        .status-PROCESSING { border-left-color: #f5a623; }
        .status-COMPLETED { border-left-color: #4caf50; }
        .status-FAILED { border-left-color: #f44336; }
    </style>
</head>

<!-- backend/app/templates/index.html — PART 2 -->
    <style>
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 40px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-item { background: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .gallery-item p { margin: 0 0 10px 0; font-size: 0.9rem; color: #b0b0b0; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .meta-details { font-size: 0.75rem; color: #777; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .badge-COMPLETED { background: #1b4322; color: #81c784; }
        .badge-PROCESSING { background: #4c3000; color: #ffb74d; }
        .badge-QUEUED { background: #0a2540; color: #63b3ed; }
        .badge-FAILED { background: #420f10; color: #e57373; }
        
        .engine-badge { font-size: 0.7rem; padding: 2px 5px; border-radius: 3px; font-weight: bold; background: #333; color: #aaa; }
        .engine-LIVE { background: #2b1d42; color: #b794f4; border: 1px solid #553c7b; }

        .btn-delete { background: #2a1415; color: #ff8080; width: auto; padding: 5px 10px; margin: 0; font-size: 0.75rem; border: 1px solid #5a2425; cursor: pointer; border-radius: 4px; }
        .btn-delete:hover { background: #4a1c1e; }
        
        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; margin-bottom: 12px; overflow: hidden; border: 1px solid #2d2d2d; }
        .video-container-9-16 { aspect-ratio: 9/16; max-height: 250px; }
        .video-container-1-1 { aspect-ratio: 1/1; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .shimmer-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 0.8rem; background: linear-gradient(90deg, #1a1a1a 25%, #262626 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmerEffect 1.5s infinite linear; }
        .failed-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #241415; color: #ec5858; font-size: 0.8rem; font-weight: bold; border: 1px solid #542224; text-align: center; padding: 10px; box-sizing: border-box; }

        @keyframes shimmerEffect {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>



<!-- backend/app/templates/index.html — PART 3 (UPDATED WITH RESOLUTION SELECTOR) -->
<body>
    <div class="creator-panel">
        <h1>MIZIZI AI Video Generator</h1>
        
        <div class="engine-selector">
            <span>Execution Environment Layer:</span>
            <select id="engineModeInput">
                <option value="LIVE" selected>🌐 Live Local ComfyUI Instance</option>
                <option value="MOCK">🤖 Offline Simulation Mode (\$0)</option>
            </select>
        </div>
        
        <label style="font-size: 0.8rem; color: #aaa;">Prompt Text</label>
        <input type="text" id="promptInput" value="A cinematic drone shot flying over a futuristic African city at sunset">
        
        <div class="settings-matrix">
            <div>
                <label>Aspect Ratio</label>
                <select id="aspectRatioInput">
                    <option value="16:9">16:9 (Horizontal)</option>
                    <option value="9:16">9:16 (Vertical)</option>
                    <option value="1:1">1:1 (Square)</option>
                </select>
            </div>
            <div>
                <!-- New Video Dimension Selection Layer -->
                <label>Target Resolution Size</label>
                <select id="resolutionInput">
                    <option value="1024x576">1024 x 576 (HD Standard)</option>
                    <option value="768x432">768 x 432 (Balanced)</option>
                    <option value="512x512">512 x 512 (Square Native)</option>
                </select>
            </div>
        </div>
        
        <div class="settings-matrix">
            <div>
                <label>Steps</label>
                <input type="number" id="stepsInput" value="20" min="1" max="50">
            </div>
            <div>
                <label>Seed (Use -1 for random)</label>
                <input type="number" id="seedInput" value="-1">
            </div>
        </div>

        <button onclick="startGeneration()">Generate Video</button>
        <div id="statusArea"></div>
    </div>

    <h2>Generation History Gallery</h2>
    
    <div class="filter-toolbar">
        <div class="filter-group" style="flex: 1;">
            <label for="searchPrompt">Search Prompts:</label>
            <input type="text" id="searchPrompt" placeholder="Type keywords..." oninput="loadGallery()" style="margin: 0; padding: 6px 12px; background: #2a2a2a; border-color: #444; font-size: 0.85rem; width: 100%;">
        </div>
        <div class="filter-group">
            <label for="filterEngine">Engine:</label>
            <select id="filterEngine" onchange="loadGallery()">
                <option value="ALL">All Environments</option>
                <option value="MOCK">🤖 Mock Engine Only</option>
                <option value="LIVE">🌐 Live Instance Only</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterStatus">Status:</label>
            <select id="filterStatus" onchange="loadGallery()">
                <option value="ALL">All States</option>
                <option value="COMPLETED">Completed</option>
                <option value="FAILED">Failed</option>
                <option value="PROCESSING">Processing</option>
            </select>
        </div>
    </div>

    <div id="bulkActionsBar" class="bulk-actions-bar">
        <span id="bulkCountLabel">0 rows selected for deletion</span>
        <button class="btn-delete" onclick="executeBulkDelete()" style="background: #ff4d4d; color: white; border-color: #cc0000; font-weight: bold;">🗑️ Delete Selected</button>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>



<!-- backend/app/templates/index.html — PART 4 (CACHE-BUSTER INTEGRATED) -->
    <script>
        window.onload = loadGallery;

        function renderMediaPreview(status, videoPath, ratio) {
            let containerClass = "video-container";
            if (ratio === "9:16") containerClass += " video-container-9-16";
            if (ratio === "1:1") containerClass += " video-container-1-1";

            if (status === 'COMPLETED' && videoPath) {
                // Appending a live browser timestamp forces it to fetch the actual local file bytes every single frame view
                const forcedFreshUrl = `${videoPath}?t=${new Date().getTime()}`;
                return `
                    <div class="${containerClass}">
                        <video controls loop muted playsinline>
                            <source src="${forcedFreshUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                `;
            } else if (status === 'QUEUED' || status === 'PROCESSING') {
                return `
                    <div class="${containerClass}">
                        <div class="shimmer-placeholder">
                            <span style="font-weight: bold; letter-spacing: 1px; color: #f5a623;">⚡ PIPELINE ACTIVE</span>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="${containerClass}">
                        <div class="failed-placeholder">
                            <span>❌ Generation Failed</span>
                        </div>
                    </div>
                `;
            }
        }

        async function loadGallery() {
            const grid = document.getElementById('galleryGrid');
            
            const searchText = document.getElementById('searchPrompt').value.toLowerCase();
            const engineFilter = document.getElementById('filterEngine').value;
            const statusFilter = document.getElementById('filterStatus').value;

            try {
                const response = await fetch('/api/jobs');
                let jobs = await response.json();
                
                if (searchText) {
                    jobs = jobs.filter(job => job.prompt.toLowerCase().includes(searchText));
                }
                if (engineFilter !== 'ALL') {
                    jobs = jobs.filter(job => job.engine_mode === engineFilter);
                }
                if (statusFilter !== 'ALL') {
                    jobs = jobs.filter(job => job.status === statusFilter);
                }

                updateBulkActionsBar();

                if (jobs.length === 0) {
                    grid.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">No matching generations found.</p>';
                    return;
                }

                grid.innerHTML = jobs.map(job => `
                    <div class="gallery-item">
                        <input type="checkbox" class="item-checkbox" value="${job.id}" onchange="updateBulkActionsBar()">
                        
                        <div style="margin-top: 10px;">
                            ${renderMediaPreview(job.status, job.video_path, job.aspect_ratio)}
                            <p title="${job.prompt}">"${job.prompt}"</p>
                            <div class="meta-details">
                                <span style="font-size:0.7rem; color:#666;">📐 ${job.aspect_ratio} | ⚙️ ${job.steps}</span>
                                <span class="engine-badge engine-${job.engine_mode}">${job.engine_mode}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <span class="badge badge-${job.status}">${job.status}</span>
                            <div style="display: flex; gap: 5px;">
                                ${job.status === 'COMPLETED' && job.video_path ? 
                                    `<a href="\({job.video_path}" download="mizizi-\){job.id}.mp4" style="text-decoration: none;">
                                        <button class="btn-delete" style="background: #112240; color: #63b3ed; border-color: #1d4ed8;">💾 Save</button>
                                     </a>` : ''
                                }
                                <button class="btn-delete" onclick="deleteJob('${job.id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Failed to load gallery history:", err);
            }
        }

        function updateBulkActionsBar() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            const bar = document.getElementById('bulkActionsBar');
            const label = document.getElementById('bulkCountLabel');
            
            if (checkboxes.length > 0) {
                bar.style.display = 'flex';
                label.innerText = `${checkboxes.length} generation row(s) selected for removal`;
            } else {
                bar.style.display = 'none';
            }
        }

        async function executeBulkDelete() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            if (!confirm(`Are you certain you want to permanently purge these ${checkboxes.length} records?`)) return;
            
            for (let cb of checkboxes) {
                await fetch(`/api/jobs/${cb.value}`, { method: 'DELETE' });
            }
            loadGallery();
        }
    </script>


<!-- backend/app/templates/index.html — PART 5 (UPDATED WITH RESOLUTION CODES) -->
    <script>
        async function deleteJob(jobId) {
            if (!confirm("Are you sure you want to delete this history record?")) return;
            try {
                const response = await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
                if (response.ok) loadGallery();
            } catch (err) {
                console.error("Failed to execute deletion endpoint call:", err);
            }
        }

        async function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            const aspectRatio = document.getElementById('aspectRatioInput').value;
            const resolution = document.getElementById('resolutionInput').value; // Grabs dimensions string
            const steps = parseInt(document.getElementById('stepsInput').value);
            const engineMode = document.getElementById('engineModeInput').value;
            let seed = parseInt(document.getElementById('seedInput').value);

            if (seed === -1) {
                seed = Math.floor(Math.random() * 1000000);
            }

            const statusArea = document.getElementById('statusArea');
            statusArea.innerHTML = `<p>Routing request matrix to choice environmental pipeline...</p>`;

            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    prompt: prompt,
                    aspect_ratio: aspectRatio,
                    resolution: resolution, // Injected parameter field variable
                    steps: steps,
                    seed: seed,
                    engine_mode: engineMode
                })
            });
            const data = await response.json();
            
            loadGallery();
            checkJobStatus(data.job_id);
        }

        function getLiveStepLog(status) {
            if (status === 'QUEUED') return "📥 Added to execution queue thread. Waiting for engine slot allocation...";
            if (status === 'PROCESSING') return "⚙️ Running ComfyUI execution graph node loops. Running sample iterations...";
            return "✅ Execution finalized. Media files compiled safely inside static directory systems.";
        }

        async function checkJobStatus(jobId) {
            const statusArea = document.getElementById('statusArea');
            const response = await fetch(`/api/jobs/${jobId}`);
            const job = await response.json();

            statusArea.innerHTML = `
                <div class="job-card status-${job.status}">
                    <h3>Active Job Tracking: <strong>${job.status}</strong></h3>
                    <p><strong>Prompt:</strong> ${job.prompt}</p>
                    <p style="font-size: 0.85rem; color:#aaa; margin-bottom: 5px;">
                        Pipeline -> Engine: <b>${job.engine_mode}</b> | Ratio: ${job.aspect_ratio} | Size: ${job.resolution || 'Default'} | Steps: ${job.steps}
                    </p>
                    
                    <div style="background: #000; font-family: monospace; padding: 10px; border-radius: 4px; font-size: 0.8rem; color: #4caf50; border: 1px solid #222;">
                        ${getLiveStepLog(job.status)}
                    </div>
                    
                    ${job.video_path ? `<p style="margin-top: 10px;">🎉 Asset URI Location: <code>\${job.video_path}</code></p>` : ''}
                    ${job.error_message ? `<p style="color:#e57373; margin-top: 10px;">❌ Error: \${job.error_message}</p>` : ''}
                </div>
            `;

            if (job.status === 'QUEUED' || job.status === 'PROCESSING') {
                setTimeout(() => checkJobStatus(jobId), 1000);
            } else {
                loadGallery();
            }
        }
    </script>
</body>
</html>
